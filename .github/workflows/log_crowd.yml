name: Log ActiveSG Gym Crowd

on:
  schedule:
    # Runs every 10 minutes from 00:00 to 14:00 UTC (7:00 AM to 10:00 PM Singapore Time)
    - cron: '*/10 0-14 * * *'
  workflow_dispatch: # Allows manual triggers via the GitHub UI

jobs:
  scrape-and-log:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Web Scraper
      env:
        THINGSPEAK_WRITE_KEY: ${{ secrets.THINGSPEAK_WRITE_KEY }}
      run: python scraper.py
