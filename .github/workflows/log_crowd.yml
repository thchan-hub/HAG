name: Log ActiveSG Gym Crowd (Playwright)

on:
  schedule:
    # Runs every 10 minutes from 7:00 AM to 10:00 PM Singapore Time (00:00 to 14:00 UTC)
    - cron: '*/10 0-14 * * *'
  workflow_dispatch: # Allows you to test it manually anytime

jobs:
  scrape-and-log:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Install Playwright browsers and system dependencies in the Linux VM
    - name: Install Playwright Browsers
      run: |
        pip install playwright
        playwright install chromium --with-deps

    - name: Run Playwright Web Scraper
      env:
        THINGSPEAK_WRITE_KEY: ${{ secrets.THINGSPEAK_WRITE_KEY }}
        TZ: Asia/Singapore  # 💡 This forces Python's datetime to use Singapore Time
      run: python scraper.py
